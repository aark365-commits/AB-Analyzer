plugins {
    id 'com.android.application' version '8.6.1'
}

android {
    namespace 'com.ab.analyzer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ab.analyzer'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '6.0'
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
